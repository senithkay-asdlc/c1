apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ceramics-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - external

dependencies:
  endpoints:
    - component: c1-ceramics-api
      name: http
      visibility: project
      envBindings:
        address: CERAMICS_API_URL
  resources:
    - ref: c1-thunder-auth
      envBindings:
        client_id: THUNDER_AUTH_CLIENT_ID
        issuer: THUNDER_AUTH_ISSUER
        jwks_url: THUNDER_AUTH_JWKS_URL
        scopes: THUNDER_AUTH_SCOPES
