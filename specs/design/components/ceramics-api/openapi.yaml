openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Catalog, cart, checkout, order, and admin management for the Ceramics Storefront.
servers:
  - url: /
tags:
  - name: Products
  - name: Cart
  - name: Checkout
  - name: Orders

paths:
  /products:
    get:
      operationId: listProducts
      summary: List/search the product catalog
      tags: [Products]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: free-text search over name/description
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: lowStock
          in: query
          schema: { type: boolean }
          description: admin-only filter for products at/below their low-stock threshold
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createProduct
      summary: Create a new product (Store Admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid product data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not a Store Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get a single product's details
      tags: [Products]
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateProduct
      summary: Edit a product, including price and stock level (Store Admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid product data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not a Store Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: retireProduct
      summary: Retire a product from the catalog (Store Admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Product retired
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not a Store Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts:
    post:
      operationId: createCart
      summary: Start a new cart (guest or signed-in)
      tags: [Cart]
      responses:
        '201':
          description: Cart created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      operationId: getCart
      summary: View a cart
      tags: [Cart]
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: Cart not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      operationId: addCartItem
      summary: Add a product to the cart, or increase its quantity
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Invalid item or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart or product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts/{cartId}/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/ProductId'
    patch:
      operationId: updateCartItem
      summary: Change a cart item's quantity
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Invalid quantity or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove an item from the cart
      tags: [Cart]
      responses:
        '204':
          description: Item removed
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /checkout:
    post:
      operationId: checkout
      summary: Pay for a cart's contents and create an order (guest or signed-in)
      tags: [Checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created and payment captured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Invalid checkout request, empty cart, or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    get:
      operationId: listOrders
      summary: List orders — a signed-in shopper's own orders, or all orders for a Store Admin
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get a single order (owner or Store Admin only)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller does not own this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}/fulfill:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: fulfillOrder
      summary: Mark an order as fulfilled/shipped (Store Admin only)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order marked fulfilled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not a Store Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Product:
      type: object
      required: [id, name, price, stockQty, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        stockQty: { type: integer }
        lowStock: { type: boolean, description: true when stock is at or below the admin-set threshold }
        images:
          type: array
          items: { type: string }
        status: { type: string, enum: [active, retired] }
    ProductInput:
      type: object
      required: [name, price, stockQty]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        stockQty: { type: integer }
        images:
          type: array
          items: { type: string }
    Cart:
      type: object
      required: [id, items]
      properties:
        id: { type: string }
        customerId: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CheckoutRequest:
      type: object
      required: [cartId, shippingAddress, paymentDetails]
      properties:
        cartId: { type: string }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentDetails: { $ref: '#/components/schemas/PaymentDetails' }
        email: { type: string, description: required for guest checkout order confirmation }
    Address:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }
    PaymentDetails:
      type: object
      required: [paymentToken]
      properties:
        paymentToken: { type: string, description: tokenized card details from the payment provider's client-side SDK }
    Order:
      type: object
      required: [id, status, items, subtotal, shippingFee, total]
      properties:
        id: { type: string }
        customerId: { type: string, nullable: true }
        status: { type: string, enum: [paid, fulfilled, cancelled] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
